[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikicrawl"
version = "1.1.0"
description = "Polite, resumable crawler for Wikipedia places, coordinates and Commons photos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wikicrawl contributors" }]
keywords = ["wikipedia", "wikidata", "commons", "crawler", "geodata", "heritage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
wikicrawl = "wikicrawl.cli:main"

[project.urls]
Homepage = "https://github.com/thepeternemec/wikipedia-crawl"
Issues = "https://github.com/thepeternemec/wikipedia-crawl/issues"

[tool.setuptools]
packages = ["wikicrawl"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
