[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "placelore"
version = "2.0.0"
description = "Open historical places and landmarks from Wikimedia, served in the Google Places protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "placelore contributors" }]
keywords = ["open data", "cultural heritage", "historical places", "wikidata", "wikimedia commons", "google places", "geospatial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
placelore = "placelore.cli:main"

[project.urls]
Homepage = "https://github.com/thepeternemec/placelore"
Issues = "https://github.com/thepeternemec/placelore/issues"

[tool.setuptools]
packages = ["placelore"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
